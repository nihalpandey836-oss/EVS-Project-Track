<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date-Wise EVS Tracker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .tracker-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .header h2 {
            margin: 0;
            color: #2e7d32;
        }
        .date-picker {
            text-align: center;
            margin-bottom: 20px;
        }
        .date-picker label {
            font-weight: bold;
            color: #2e7d32;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 12px;
        }
        th {
            background-color: #2e7d32;
            color: white;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .summary-container {
            background-color: #e8f5e9;
            padding: 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-around;
            text-align: center;
            font-weight: bold;
            color: #2e7d32;
        }
        .summary-item span {
            display: block;
            font-size: 24px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="tracker-container">
    <div class="header">
        <h2>🌱 EVS Group Project Tracker</h2>
    </div>

    <div class="date-picker">
        <label for="wednesday-date">Select Date (Wednesday):</label>
        <input type="date" id="wednesday-date">
    </div>

    <table>
        <thead>
            <tr>
                <th>Student Name</th>
                <th>Attendance</th>
                <th>Progress</th>
                <th>Remarks</th>
            </tr>
        </thead>
        <tbody>
            <!-- 1. Yeshu -->
            <tr>
                <td style="font-weight:bold;">Yeshu</td>
                <td><select id="attendance-0" onchange="updateSummary()"><option value="Present">Present</option><option value="Absent">Absent</option></select></td>
                <td><select id="progress-0" onchange="updateSummary()"><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></td>
                <td><input type="text" placeholder="Started work on Nepal Disaster Video..."></td>
            </tr>
            <!-- 2. Nihal -->
            <tr>
                <td style="font-weight:bold;">Nihal</td>
                <td><select id="attendance-1" onchange="updateSummary()"><option value="Present">Present</option><option value="Absent">Absent</option></select></td>
                <td><select id="progress-1" onchange="updateSummary()"><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></td>
                <td><input type="text" placeholder="Started work on PPT..."></td>
            </tr>
            <!-- 3. Chaitanya -->
            <tr>
                <td style="font-weight:bold;">Chaitanya</td>
                <td><select id="attendance-2" onchange="updateSummary()"><option value="Present">Present</option><option value="Absent">Absent</option></select></td>
                <td><select id="progress-2" onchange="updateSummary()"><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></td>
                <td><input type="text" placeholder="Started work on PPT..."></td>
            </tr>
            <!-- 4. Yash -->
            <tr>
                <td style="font-weight:bold;">Yash</td>
                <td><select id="attendance-3" onchange="updateSummary()"><option value="Present">Present</option><option value="Absent">Absent</option></select></td>
                <td><select id="progress-3" onchange="updateSummary()"><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></td>
                <td><input type="text" placeholder="Not assigned..."></td>
            </tr>
            <!-- 5. Muskan -->
            <tr>
                <td style="font-weight:bold;">Muskan</td>
                <td><select id="attendance-4" onchange="updateSummary()"><option value="Present">Present</option><option value="Absent">Absent</option></select></td>
                <td><select id="progress-4" onchange="updateSummary()"><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></td>
                <td><input type="text" placeholder="Not assigned..."></td>
            </tr>
            <!-- 6. Khushi -->
            <tr>
                <td style="font-weight:bold;">Khushi</td>
                <td><select id="attendance-5" onchange="updateSummary()"><option value="Present">Present</option><option value="Absent">Absent</option></select></td>
                <td><select id="progress-5" onchange="updateSummary()"><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></td>
                <td><input type="text" placeholder="Not assigned..."></td>
            </tr>
            <!-- 7. Priyanjali -->
            <tr>
                <td style="font-weight:bold;">Priyanjali</td>
                <td><select id="attendance-6" onchange="updateSummary()"><option value="Present">Present</option><option value="Absent">Absent</option></select></td>
                <td><select id="progress-6" onchange="updateSummary()"><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></td>
                <td><input type="text" placeholder="Not assigned..."></td>
            </tr>
            <!-- 8. Mahi -->
            <tr>
                <td style="font-weight:bold;">Mahi</td>
                <td><select id="attendance-7" onchange="updateSummary()"><option value="Present">Present</option><option value="Absent">Absent</option></select></td>
                <td><select id="progress-7" onchange="updateSummary()"><option value="Not Started">Not Started</option><option value="In Progress">In Progress</option><option value="Completed">Completed</option></select></td>
                <td><input type="text" placeholder="Not assigned..."></td>
            </tr>
        </tbody>
    </table>

    <div class="summary-container">
        <div class="summary-item">
            <span id="total-present">8 / 8</span>
            Total Present Today
        </div>
        <div class="summary-item">
            <span id="completion-rate">0%</span>
            Project Completion Rate
        </div>
    </div>
</div>

<script>
    function updateSummary() {
        let presentCount = 0;
        let totalProgressPoints = 0;
        const totalStudents = 8;
        const maxPoints = totalStudents * 2;

        for (let i = 0; i < totalStudents; i++) {
            const attendance = document.getElementById(`attendance-${i}`).value;
            if (attendance === "Present") {
                presentCount++;
            }

            const progress = document.getElementById(`progress-${i}`).value;
            if (progress === "In Progress") {
                totalProgressPoints += 1;
            } else if (progress === "Completed") {
                totalProgressPoints += 2;
            }
        }

        document.getElementById('total-present').innerText = `${presentCount} / ${totalStudents}`;
        const completionRate = Math.round((totalProgressPoints / maxPoints) * 100);
        document.getElementById('completion-rate').innerText = `${completionRate}%`;
    }

    // Set automatic Wednesday date limit or default
    window.onload = function() {
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('wednesday-date').value = today;
        updateSummary();
    }
</script>
</body>
</html>
